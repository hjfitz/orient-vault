# carrier-integrations — Waypoint system index. Cheap orientation only, never documentation.
# Members are NOT listed here: a service joins by declaring `system: carrier-integrations` in its
# own waypoint.yaml, so there is one source of truth. `wp system status carrier-integrations` reads it.
system: carrier-integrations
owner: carrier-integrations
purpose: >
  How GFS exchanges data with carriers. Ingress (GFS to carrier): one proxy per carrier that Selector
  calls for labels, cancels, manifests and status. Egress (carrier to GFS): polling connectors on
  tracking-core, tracking webhooks and SFTP tracking files, all publishing to raw_tracking.v1.
  Out: Selector itself and its V4-Server-IE pre-advice files (system selector), the ECM pipeline after
  raw_tracking.v1, selector-rest-proxy, gfs-pod-service, evri-auth-facade, the carrier-playground mocks.
confluence: MPK 353468499 Carrier Services (children 353697822 Ingress, 353206337 Egress)
created: 2026-11-06
